<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#14110f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="P.E.P" />
  <title>P.E.P</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- LOGIN -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="brand-mark">P·E·P</div>
      <h1>Plan Estratégico Personal</h1>
      <p class="muted">Tu año, a la vista.</p>
      <form id="loginForm" autocomplete="on">
        <label>Email
          <input type="email" name="email" autocomplete="username" required inputmode="email" />
        </label>
        <label>Contraseña
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary block" type="submit">Entrar</button>
        <p id="loginError" class="error"></p>
      </form>
    </div>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand-mark small">P·E·P</div>
      <div class="year-switch">
        <button class="icon-btn" id="yearPrev" aria-label="Año anterior">‹</button>
        <span id="yearLabel">2026</span>
        <button class="icon-btn" id="yearNext" aria-label="Año siguiente">›</button>
      </div>
      <div class="top-actions">
        <span id="saveState" class="save-state" title="Estado de guardado"></span>
        <button class="icon-btn" id="menuBtn" aria-label="Menú">⋯</button>
      </div>
    </header>

    <div id="menu" class="menu hidden">
      <button data-action="export">Descargar copia (JSON)</button>
      <button data-action="import">Importar copia</button>
      <button data-action="logout" class="danger-text">Cerrar sesión</button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </div>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="resumen" class="active"><span class="ti">◎</span><span>Resumen</span></button>
      <button data-tab="objetivos"><span class="ti">◆</span><span>Objetivos</span></button>
      <button data-tab="habitos"><span class="ti">↻</span><span>Hábitos</span></button>
      <button data-tab="viajes"><span class="ti">✈</span><span>Viajes</span></button>
      <button data-tab="oscuridad"><span class="ti">☾</span><span>Oscuridad</span></button>
      <button data-tab="luz"><span class="ti">☀</span><span>Luz</span></button>
    </nav>
  </div>

  <!-- SHEET / MODAL -->
  <div id="sheetWrap" class="sheet-wrap hidden">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
